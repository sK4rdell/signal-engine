name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test?sslmode=disable
  TEST_SMTP_ADDR: localhost:1025
  TEST_MAILPIT_URL: http://localhost:8025

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './old/*'))
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o bin/ ./cmd/...

      - name: Apply migrations to an empty database
        env:
          DATABASE_URL: postgres://app:app@localhost:5432/app_test?sslmode=disable
          # cmd/migrate loads the full configuration; the development key
          # is fine here because CI runs with ENV=development.
          AUTH_ENCRYPTION_KEY: 626574656d706c6174652d6465762d6b65792d646f2d6e6f742d757365212121
        run: |
          ./bin/migrate up
          ./bin/migrate status

      - name: Test
        run: go test -count=1 ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: signal-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
